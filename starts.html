<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Site Statistics</title>
<style>
:root{--bg:#030817;--panel:#09152b;--blue:#20baff;--green:#2cff8a;--gold:#ffbf24;--purple:#bd57ff;--muted:#a7bbd8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;color:#f5f8ff;background:radial-gradient(ellipse at 50% 0%,#102c58 0%,#061124 40%,#020613 78%);padding:28px 16px 36px;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#2aaeff70 1px,transparent 1px);background-size:56px 56px;opacity:.17;mask-image:linear-gradient(to bottom,#000,transparent 75%)}
.wrap{max-width:1180px;margin:auto;position:relative}.heading{text-align:center;margin:8px auto 30px}.title{display:flex;justify-content:center;align-items:center;gap:14px;font-size:clamp(28px,5vw,52px);font-weight:800;letter-spacing:-1px}.title .mark{color:#20baff;text-shadow:0 0 24px #20baff66}.subtitle{color:#b8c8e8;margin-top:9px;font-size:clamp(13px,2vw,17px)}.live{position:absolute;right:0;top:10px;border:1px solid #17d56c66;color:#55ff9a;background:#062419;padding:9px 16px;border-radius:30px;font-size:13px;display:flex;align-items:center;gap:8px;box-shadow:0 0 24px #16d86b22}.dot{width:8px;height:8px;background:#31ff87;border-radius:50%;box-shadow:0 0 12px #31ff87;animation:pulse 1.4s infinite}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{--accent:var(--blue);--accent2:#0757ff;position:relative;background:linear-gradient(145deg,#071a36eF,#061025f5);border:1px solid color-mix(in srgb,var(--accent),transparent 30%);border-radius:23px;padding:24px 20px 18px;min-height:300px;overflow:hidden;box-shadow:inset 0 0 24px color-mix(in srgb,var(--accent),transparent 92%),0 0 20px color-mix(in srgb,var(--accent),transparent 91%);animation:float 5.2s ease-in-out infinite;transition:transform .3s,box-shadow .3s}.card:nth-child(2){animation-delay:.7s}.card:nth-child(3){animation-delay:1.4s}.card:nth-child(4){animation-delay:2.1s}.card:hover{transform:translateY(-7px);box-shadow:inset 0 0 24px color-mix(in srgb,var(--accent),transparent 90%),0 0 28px color-mix(in srgb,var(--accent),transparent 78%)}.card:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 15%,color-mix(in srgb,var(--accent),transparent 94%),transparent 80%);pointer-events:none}.icon{width:76px;height:76px;border:2px solid var(--accent);border-radius:50%;display:grid;place-items:center;margin:-3px auto 15px;font-size:32px;background:color-mix(in srgb,var(--accent),#071326 85%);box-shadow:0 0 24px color-mix(in srgb,var(--accent),transparent 68%)}.label{text-align:center;font-size:17px;font-weight:650;color:#e9f1ff}.value{text-align:center;font-size:clamp(29px,3.1vw,43px);font-weight:800;letter-spacing:1px;margin:16px 0 6px;color:var(--accent);text-shadow:0 0 18px color-mix(in srgb,var(--accent),transparent 58%);font-variant-numeric:tabular-nums}.unit{text-align:center;color:#adbedb;font-size:12px}.spark{height:56px;margin:18px 0 3px;display:flex;align-items:end;gap:5px}.spark span{flex:1;border-radius:8px 8px 0 0;background:linear-gradient(to top,var(--accent2),var(--accent));opacity:.72;min-height:7px;animation:bar 2.8s ease-in-out infinite alternate}.spark span:nth-child(2n){animation-delay:.3s}.spark span:nth-child(3n){animation-delay:.8s}.trend{text-align:center;font-size:12px;color:#c0cde3;margin-top:9px}.trend b{color:var(--accent)}.online{--accent:var(--blue);--accent2:#0862ff}.withdraw{--accent:var(--green);--accent2:#009c55}.harvest{--accent:var(--gold);--accent2:#b77a00}.verified{--accent:var(--purple);--accent2:#6c12cc}
.ticker{margin:24px 0 0;border:1px solid #2542a5;border-radius:18px;background:#060e22;box-shadow:0 0 22px #1356ff22;padding:13px 16px;display:flex;align-items:center;gap:15px;overflow:hidden}.ticker-label{color:#32d8ff;font-weight:750;white-space:nowrap}.ticker-window{overflow:hidden;white-space:nowrap;flex:1;color:#cfddf6;font-size:13px}.ticker-track{display:inline-block;animation:scroll 25s linear infinite}.ticker-track span{padding:0 28px}.ticker-track strong{color:#6dff9f}.note{text-align:center;font-size:11px;color:#8294b3;margin:14px 0 0}
@keyframes pulse{50%{opacity:.35;transform:scale(.82)}}@keyframes float{0%,100%{translate:0 0}50%{translate:0 -4px}}@keyframes bar{to{height:var(--h,80%)}}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.live{position:static;width:max-content;margin:0 auto 15px}.heading{margin-bottom:20px}}@media(max-width:500px){body{padding:20px 12px}.cards{gap:11px}.card{padding:19px 12px 15px;min-height:250px;border-radius:18px}.icon{width:58px;height:58px;font-size:25px}.label{font-size:14px}.value{font-size:clamp(24px,7vw,32px);margin:13px 0 5px}.spark{height:40px;gap:3px}.ticker{padding:12px}.ticker-label{font-size:12px}.ticker-window{font-size:11px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="live"><i class="dot"></i> Last 24 Hrs Stats</div>
  <header class="heading"><div class="title"><span class="mark">▥</span> Site Statistics</div><div class="subtitle">Total Stats · Last 24 Hours</div></header>
  <section class="cards">
    <article class="card online"><div class="icon">👥</div><div class="label">Online</div><div class="value" id="online">54,000</div><div class="unit">Last 24 hours</div><div class="spark" aria-hidden="true"></div><div class="trend"><b id="onlineTrend">↗ fluctuating</b></div></article>
    <article class="card withdraw"><div class="icon">▣</div><div class="label">Total Withdraws</div><div class="value" id="withdraws">4,500</div><div class="unit">Users · Last 24 hours</div><div class="spark" aria-hidden="true"></div><div class="trend"><b>↗ irregular updates</b></div></article>
    <article class="card harvest"><div class="icon">🌱</div><div class="label">Total Harvest</div><div class="value" id="harvest">5,863,235</div><div class="unit">Last 24 hours</div><div class="spark" aria-hidden="true"></div><div class="trend"><b>↗ occasional increments</b></div></article>
    <article class="card verified"><div class="icon">✓</div><div class="label">Total Verified</div><div class="value" id="verified">6,543</div><div class="unit">Last 24 hours</div><div class="spark" aria-hidden="true"></div><div class="trend"><b>↗ occasional increments</b></div></article>
  </section>
  
  
</div>
<script>
(() => {
  const el = id => document.getElementById(id);
  const fmt = n => Math.floor(n).toLocaleString('en-US');
  const base = { online: 54000, withdraws: 4500, harvest: 5863235, verified: 6543 };
  const keys = ['online','withdraws','harvest','verified'];
  const DAY = 86400000;
  const STORAGE_KEY = 'standaloneDemoStats24h_v1';
  let stats = {...base};
  let lastUpdate = Date.now();
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (saved && saved.values && saved.updatedAt && Date.now() - saved.updatedAt < DAY) {
      stats = {...base, ...saved.values};
      lastUpdate = saved.updatedAt;
    }
  } catch (_) {}
  const render = () => keys.forEach(k => { el(k).textContent = fmt(stats[k]); });
  function dailyRefresh() {
    // Daily-only randomized changes; values are demo figures, not real activity.
    stats.online = Math.max(0, base.online + Math.floor((Math.random()-0.5)*5000));
    stats.withdraws = Math.max(0, base.withdraws + Math.floor((Math.random()-0.5)*450));
    stats.harvest = Math.max(0, base.harvest + Math.floor((Math.random()-0.5)*650000));
    stats.verified = Math.max(0, base.verified + Math.floor((Math.random()-0.5)*700));
    lastUpdate = Date.now();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({values:stats, updatedAt:lastUpdate})); } catch (_) {}
    render();
  }
  // Refresh only after 24 hours have elapsed, including time while the page is closed.
  setInterval(() => { if (Date.now() - lastUpdate >= DAY) dailyRefresh(); }, 60000);
  document.querySelectorAll('.spark').forEach(s => { for(let i=0;i<10;i++){const b=document.createElement('span');b.style.height=(15+Math.random()*85)+'%';b.style.setProperty('--h',(20+Math.random()*80)+'%');s.appendChild(b);} });
  render();
})();
</script>
</body></html>
