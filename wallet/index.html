<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Wallet · Urgent Cash</title>
<link rel="icon" type="image/png" href="../logo.png">
<style>
:root{
  --bg:#eaf6ff; --bg2:#dff5c9; --card:#ffffff; --text:#172438; --muted:#68778b; --border:#dce5ef;
  --primary:#1678e8; --soft:#eaf3ff; --gold:#e0a400; --good:#16a36a; --bad:#d93f3f;
  --fbg:#ffffff; --ftx:#4a4a4a; --fln:rgba(0,0,0,.12); --fon:#0a9d68;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0b1220; --bg2:#0f2a1c; --card:#151e2e; --text:#edf4ff; --muted:#a0aec2; --border:#29374c;
    --primary:#3189f4; --soft:#192a42; --gold:#ffc83d; --good:#2ee59d; --bad:#ff8a80;
    --fbg:#1f1f1f; --ftx:#c9c9c9; --fln:rgba(255,255,255,.1); --fon:#2ee59d; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
  background:linear-gradient(var(--bg),var(--bg2)) fixed;padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
.wrap{max-width:480px;margin:0 auto;display:grid;gap:14px}
.top{display:flex;align-items:center;gap:12px}
.top img{width:52px;height:52px;object-fit:contain}
.top h1{margin:0;font-size:1.3rem;letter-spacing:-.4px}
.top p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:0 8px 28px rgba(0,0,0,.07)}
.card h2{margin:0 0 12px;font-size:1.02rem}
.balance{text-align:center}
.balance small{color:var(--muted);font-size:.8rem}
.balance .big{font-size:2.3rem;font-weight:900;color:var(--gold);letter-spacing:-1px;margin:4px 0}
.balance .ngn{color:var(--muted);font-size:.95rem;font-weight:600}
.btns{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px}
.btn{font:inherit;border:0;border-radius:12px;padding:13px 14px;font-weight:700;cursor:pointer;background:var(--primary);color:#fff;text-align:center;text-decoration:none;display:block;width:100%}
.btn.alt{background:var(--soft);color:var(--text);border:1px solid var(--border)}
.btn:active{transform:scale(.98)}
.btn.insufficient{background:var(--bad);color:#fff;opacity:.75;cursor:not-allowed}
.btn.ready{background:var(--good);color:#fff;opacity:1}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.head h2{margin:0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tabs button{font:inherit;font-size:.85rem;border:1px solid var(--border);border-radius:12px;padding:9px;font-weight:700;cursor:pointer;background:var(--soft);color:var(--text)}
.tabs button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.list{display:grid;gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:.88rem}
.item small{color:var(--muted);display:block;margin-top:2px}
.amt{font-weight:800;white-space:nowrap;text-align:right}
.amt.in{color:var(--good)} .amt.out{color:var(--bad)}
.st{display:block;font-size:.7rem;font-weight:700;margin-top:2px}
.st.pending{color:var(--gold)} .st.approved{color:var(--good)} .st.rejected{color:var(--bad)}
.note{color:var(--muted);font-size:.8rem;line-height:1.5;margin:8px 0 0}
.hidden{display:none!important}
.center{text-align:center;color:var(--muted);padding:40px 0}
footer{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;gap:0;padding:0 0 env(safe-area-inset-bottom);background:var(--fbg);border-top:1px solid var(--fln)}
footer a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;color:var(--ftx);text-decoration:none;font-size:.75rem;font-weight:500}
footer a span{font-size:1.4rem;line-height:1}
footer a.on{color:var(--fon)} footer a:active{background:var(--fln)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img src="../logo.png" alt="Urgent Cash logo">
    <div><h1>My Wallet</h1><p>Your balance and transactions</p></div>
  </div>

  <div id="loading" class="center">Loading your wallet…</div>

  <div id="main" class="hidden" style="display:grid;gap:14px">
    <section class="card balance">
      <small>Available balance</small>
      <div class="big" id="bUsd">$0.00</div>
      <div class="ngn" id="bNgn">₦0.00</div>
      <div class="btns">
        <button class="btn insufficient" id="withdrawBtn" type="button" aria-disabled="true">Insufficient Funds</button>
      </div>
    </section>


    <section class="card">
      <div class="head"><h2>🧾 Withdrawal history</h2></div>
      <div class="list" id="hist"></div>
      <p class="note" id="histEmpty">No withdrawals yet.</p>
    </section>
  </div>
</div>


<footer>
  <a href="../home.html"><span>🏠</span>Home</a>
  <a href="index.html" class="on"><span>💼</span>Wallet</a>
  <a href="../profile.html"><span>👤</span>Profile</a>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import { getFirestore, doc, onSnapshot, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

/* ============ CONFIG ============ */
const POINTS_PER_USD = 100;   // must match home.html
const NGN_RATE       = 1500;  // fixed rate, same as the farm
const MIN_WITHDRAW_NGN = 30000;
const WITHDRAW_PAGE = "withdrawStarstarCash.html";
const LOGIN_PAGE     = "../login.html";
const firebaseConfig = {
  apiKey:"AIzaSyA2LtEPKS6jU3nIsAj-KV3MoxmUULj_5a8", authDomain:"urgent-cash-76162.firebaseapp.com",
  projectId:"urgent-cash-76162", storageBucket:"urgent-cash-76162.firebasestorage.app",
  messagingSenderId:"1000483783652", appId:"1:1000483783652:web:f4406e7adb5016b5167df1", measurementId:"G-PN610M8757"
};
/* ================================== */

const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
const usd = v => "$" + v.toLocaleString("en-US", { minimumFractionDigits:2, maximumFractionDigits:2 });
const ngn = v => "₦" + v.toLocaleString("en-NG", { minimumFractionDigits:2, maximumFractionDigits:2 });
const fmtDate = ms => ms ? new Date(ms).toLocaleString(undefined, { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" }) : "—";

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
let all = [];
let currentPoints = 0;
function drawHistory(){
  const list = all;
  $("histEmpty").classList.toggle("hidden", list.length > 0);
  $("hist").innerHTML = list.map(r => {
    const sub = r.bank ? esc(r.bank) + " · " + esc(r.accountNumber) : "";
    return `<div class="item"><div><b>Withdrawal</b><small>${fmtDate(r.createdAt?.toMillis?.())}</small>${sub ? "<small>" + sub + "</small>" : ""}</div>
      <div class="amt out">−${usd(r.amountUsd || 0)}<span class="st ${esc(r.status)}">${esc(r.status)}</span></div></div>`;
  }).join("");
}
function updateWithdrawButton(pts){
  const btn = $("withdrawBtn");
  const nairaBalance = (pts / POINTS_PER_USD) * NGN_RATE;
  const eligible = nairaBalance >= MIN_WITHDRAW_NGN;
  btn.classList.toggle("insufficient", !eligible);
  btn.classList.toggle("ready", eligible);
  btn.textContent = eligible ? "Withdraw" : "Insufficient Funds";
  btn.setAttribute("aria-disabled", String(!eligible));
}
$("withdrawBtn").addEventListener("click", () => {
  const nairaBalance = (currentPoints / POINTS_PER_USD) * NGN_RATE;
  if (nairaBalance < MIN_WITHDRAW_NGN) {
    alert("Insufficient funds. Minimum withdrawal amount is ₦30,000.");
    return;
  }
  location.href = WITHDRAW_PAGE;
});

onAuthStateChanged(auth, async user => {
  if (!user) { location.replace(LOGIN_PAGE); return; }
  try {
    // live balance
    onSnapshot(doc(db, "users", user.uid), snap => {
      currentPoints = (snap.exists() && snap.data().state && snap.data().state.pts) || 0;
      const dollars = currentPoints / POINTS_PER_USD;
      $("bUsd").textContent = usd(dollars);
      $("bNgn").textContent = ngn(dollars * NGN_RATE);
      updateWithdrawButton(currentPoints);
    });
    // history (sorted here so no special Firestore index is needed)
    const snap = await getDocs(query(collection(db, "walletRequests"), where("uid", "==", user.uid)));
    all = snap.docs.map(d => d.data()).filter(r => r.type === "withdraw").sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
    drawHistory();
  } catch (e) {
    console.error(e);
    $("loading").textContent = "Could not load your wallet. Check your connection and refresh.";
    return;
  }
  $("loading").classList.add("hidden"); $("main").classList.remove("hidden");
});
</script>
</body>
</html>
