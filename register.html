
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f3f7fd">
<title>Create Account | Urgent Cash</title>

<style>
:root{
  color-scheme:light dark;
  --primary:#1678e8;
  --primary-hover:#0c60c5;
  --bg:#f3f7fd;
  --surface:#ffffff;
  --surface-soft:#f8fbff;
  --text:#172b45;
  --muted:#708198;
  --border:#dce6f2;
  --danger:#d9364f;
  --success:#168550;
  --shadow:0 16px 50px rgba(35,83,140,.09);
}

@media(prefers-color-scheme:dark){
  :root{
    --primary:#69aaff;
    --primary-hover:#8bbaff;
    --bg:#12161e;
    --surface:#1b212c;
    --surface-soft:#222b38;
    --text:#edf3fc;
    --muted:#a1afc3;
    --border:#344154;
    --danger:#ff7186;
    --success:#54d695;
    --shadow:0 16px 50px rgba(0,0,0,.25);
  }
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  padding:24px 16px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  transition:background .2s,color .2s;
}

.card{
  width:100%;
  max-width:450px;
  padding:30px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:25px;
  box-shadow:var(--shadow);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:28px;
}

.brand-icon{
  width:48px;
  height:48px;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:linear-gradient(135deg,#1789f7,#0862ce);
  color:#fff;
  font-weight:900;
  font-size:21px;
}

.brand-name{
  font-weight:800;
  font-size:19px;
  letter-spacing:-.5px;
}

.brand-tag{
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}

h1{
  margin:0;
  font-size:29px;
  letter-spacing:-1px;
}

.subtitle{
  color:var(--muted);
  margin:8px 0 25px;
  font-size:14px;
  line-height:1.6;
}

.field{margin-bottom:18px}

label{
  display:block;
  margin-bottom:8px;
  font-size:14px;
  font-weight:650;
}

.input-wrap{position:relative}

input{
  width:100%;
  height:52px;
  padding:0 14px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--surface-soft);
  color:var(--text);
  font-size:15px;
  outline:none;
  transition:.2s;
}

input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 15%,transparent);
  background:var(--surface);
}

input::placeholder{color:var(--muted)}

.password-input{padding-right:78px}

.toggle-password{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:transparent;
  color:var(--primary);
  font-size:12px;
  font-weight:750;
  cursor:pointer;
  padding:8px;
}

.hint{
  margin-top:7px;
  color:var(--muted);
  font-size:12px;
}

.primary-btn{
  width:100%;
  height:53px;
  margin-top:5px;
  border:0;
  border-radius:13px;
  background:var(--primary);
  color:#fff;
  font-weight:800;
  font-size:15px;
  cursor:pointer;
  transition:.2s;
}

.primary-btn:hover{
  background:var(--primary-hover);
  transform:translateY(-1px);
}

.primary-btn:disabled{
  opacity:.65;
  cursor:not-allowed;
  transform:none;
}

.message{
  display:none;
  padding:12px 14px;
  margin-top:16px;
  border-radius:12px;
  font-size:13px;
  line-height:1.5;
}

.message.error{
  display:block;
  background:color-mix(in srgb,var(--danger) 10%,var(--surface));
  color:var(--danger);
  border:1px solid color-mix(in srgb,var(--danger) 30%,var(--border));
}

.message.success{
  display:block;
  background:color-mix(in srgb,var(--success) 10%,var(--surface));
  color:var(--success);
  border:1px solid color-mix(in srgb,var(--success) 30%,var(--border));
}

.divider{
  display:flex;
  align-items:center;
  gap:12px;
  margin:23px 0;
  color:var(--muted);
  font-size:12px;
}

.divider::before,.divider::after{
  content:"";
  flex:1;
  height:1px;
  background:var(--border);
}

.footer{
  text-align:center;
  font-size:14px;
  color:var(--muted);
  margin-top:20px;
}

.footer a,.home-link{
  color:var(--primary);
  font-weight:700;
  text-decoration:none;
}

.footer a:hover,.home-link:hover{text-decoration:underline}

.home{
  text-align:center;
  margin-top:20px;
  font-size:13px;
}

.terms{
  font-size:12px;
  line-height:1.6;
  color:var(--muted);
  text-align:center;
  margin-top:18px;
}

button:focus-visible,a:focus-visible,input:focus-visible{
  outline:2px solid var(--primary);
  outline-offset:3px;
}

@media(max-width:420px){
  body{padding:14px}
  .card{padding:23px 19px;border-radius:20px}
  h1{font-size:26px}
}
</style>
</head>

<body>
<main class="card">

  <div class="brand">
    <div class="brand-icon">U</div>
    <div>
      <div class="brand-name">Urgent Cash</div>
      <div class="brand-tag">Your account, your access</div>
    </div>
  </div>

  <h1>Create account</h1>
  <p class="subtitle">Create your account to get started with Urgent Cash.</p>

  <form id="registerForm">

    <div class="field">
      <label for="name">Full name</label>
      <input
        id="name"
        type="text"
        placeholder="Enter your full name"
        autocomplete="name"
        maxlength="80"
        required
      >
    </div>

    <div class="field">
      <label for="email">Email address</label>
      <input
        id="email"
        type="email"
        placeholder="you@example.com"
        autocomplete="email"
        maxlength="254"
        required
      >
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap">
        <input
          id="password"
          class="password-input"
          type="password"
          placeholder="Create a password"
          autocomplete="new-password"
          minlength="6"
          required
        >
        <button type="button" class="toggle-password" id="togglePassword">Show</button>
      </div>
      <div class="hint">Use at least 6 characters.</div>
    </div>

    <div class="field">
      <label for="confirmPassword">Confirm password</label>
      <div class="input-wrap">
        <input
          id="confirmPassword"
          class="password-input"
          type="password"
          placeholder="Enter password again"
          autocomplete="new-password"
          required
        >
        <button type="button" class="toggle-password" id="toggleConfirm">Show</button>
      </div>
    </div>

    <button class="primary-btn" id="submitBtn" type="submit">Create account</button>

  </form>

  <div class="message" id="message" role="status" aria-live="polite"></div>

  <div class="divider">Already have an account?</div>

  <div class="footer">
    <a href="login.html">Sign in instead</a>
  </div>

  <div class="home">
    <a class="home-link" href="index.html">← Back to home</a>
  </div>

  <div class="terms">
    Use an email address you own and keep your password private.
  </div>

</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  updateProfile
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig={
  apiKey:"AIzaSyA2LtEPKS6jU3nIsAj-KV3MoxmUULj_5a8",
  authDomain:"urgent-cash-76162.firebaseapp.com",
  projectId:"urgent-cash-76162",
  storageBucket:"urgent-cash-76162.firebasestorage.app",
  messagingSenderId:"1000483783652",
  appId:"1:1000483783652:web:f4406e7adb5016b5167df1",
  measurementId:"G-PN610M8757"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);

const form=document.getElementById("registerForm");
const nameInput=document.getElementById("name");
const emailInput=document.getElementById("email");
const passwordInput=document.getElementById("password");
const confirmInput=document.getElementById("confirmPassword");
const submitBtn=document.getElementById("submitBtn");
const message=document.getElementById("message");

function toggleVisibility(input,button){
  const visible=input.type==="password";
  input.type=visible?"text":"password";
  button.textContent=visible?"Hide":"Show";
}

document.getElementById("togglePassword").addEventListener("click",()=>{
  toggleVisibility(passwordInput,document.getElementById("togglePassword"));
});

document.getElementById("toggleConfirm").addEventListener("click",()=>{
  toggleVisibility(confirmInput,document.getElementById("toggleConfirm"));
});

function showMessage(text,type="error"){
  message.className="message "+type;
  message.textContent=text;
}

function getErrorMessage(code){
  const errors={
    "auth/email-already-in-use":"This email already has an account. Try signing in.",
    "auth/invalid-email":"Please enter a valid email address.",
    "auth/weak-password":"Your password is too weak. Choose a stronger password.",
    "auth/network-request-failed":"Connection failed. Check your internet and try again.",
    "auth/too-many-requests":"Too many attempts. Please wait and try again later.",
    "auth/operation-not-allowed":"Email registration is not enabled in Firebase yet.",
    "auth/invalid-api-key":"Firebase configuration error. Please contact support.",
    "auth/configuration-not-found":"Firebase Authentication isn't configured yet."
  };
  return errors[code]||"Something went wrong. Please try again.";
}

form.addEventListener("submit",async event=>{
  event.preventDefault();

  const name=nameInput.value.trim();
  const email=emailInput.value.trim().toLowerCase();
  const password=passwordInput.value;
  const confirmPassword=confirmInput.value;

  message.className="message";
  message.textContent="";

  if(name.length<2){
    showMessage("Please enter your full name.");
    nameInput.focus();
    return;
  }

  if(password.length<6){
    showMessage("Password must be at least 6 characters.");
    passwordInput.focus();
    return;
  }

  if(password!==confirmPassword){
    showMessage("Your passwords do not match.");
    confirmInput.focus();
    return;
  }

  submitBtn.disabled=true;
  submitBtn.textContent="Creating account…";

  try{
    const credential=await createUserWithEmailAndPassword(auth,email,password);

    await updateProfile(credential.user,{
      displayName:name
    });

    showMessage("Account created successfully! Redirecting…","success");

    window.location.replace("home.html");

  }catch(error){
    showMessage(getErrorMessage(error.code));
  }finally{
    submitBtn.disabled=false;
    submitBtn.textContent="Create account";
  }
});
</script>
</body>
</html>
