<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | Urgent Cash</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(140deg,#f4f8ff,#e7f1ff);color:#15263b;font-family:system-ui,Arial;display:grid;place-items:center;padding:20px}.card{width:min(100%,440px);padding:28px;border:1px solid #d5e3f3;background:#ffffff;border-radius:22px}h1{color:#1678c8;margin:0 0 8px}p{color:#52677f}label{display:block;margin:14px 0 6px;font-size:.9rem}input{width:100%;padding:13px;border:1px solid #315879;border-radius:11px;background:#091b2c;color:#fff;font-size:1rem}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:#1685dc;color:#ffffff;font-weight:800;font-size:1rem}a{color:#1678c8}.msg{min-height:1.3em;color:#ffca8a;margin-top:12px}
</style></head><body><main class="card"><h1>Create account</h1><p>Join Urgent Cash</p><form id="form"><label for="name">Full name</label><input id="name" autocomplete="name" required maxlength="80"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required><label for="password">Password (at least 6 characters)</label><input id="password" type="password" autocomplete="new-password" minlength="6" required><button id="submit">Create account</button></form><div class="msg" id="msg" role="status"></div><p>Already registered? <a href="login.html">Sign in</a></p><p><a href="index.html">← Home</a></p></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js';
import {getAuth,createUserWithEmailAndPassword,updateProfile} from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js';
const firebaseConfig={apiKey:'AIzaSyA2LtEPKS6jU3nIsAj-KV3MoxmUULj_5a8',authDomain:'urgent-cash-76162.firebaseapp.com',projectId:'urgent-cash-76162',storageBucket:'urgent-cash-76162.firebasestorage.app',messagingSenderId:'1000483783652',appId:'1:1000483783652:web:f4406e7adb5016b5167df1',measurementId:'G-PN610M8757'};
const auth=getAuth(initializeApp(firebaseConfig));const form=document.querySelector('#form'),msg=document.querySelector('#msg'),btn=document.querySelector('#submit');
form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Creating account…';msg.textContent='';try{const cred=await createUserWithEmailAndPassword(auth,document.querySelector('#email').value.trim(),document.querySelector('#password').value);await updateProfile(cred.user,{displayName:document.querySelector('#name').value.trim()});location.href='dashboard.html';}catch(err){msg.textContent=err.code==='auth/email-already-in-use'?'That email is already registered.':err.code==='auth/weak-password'?'Choose a stronger password.':err.code==='auth/invalid-email'?'Enter a valid email address.':err.message;}finally{btn.disabled=false;btn.textContent='Create account';}});
</script></body></html>
